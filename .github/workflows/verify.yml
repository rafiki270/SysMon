name: Verify
on:
  push:
    branches: [main, 'implement/**', 'worker/**']
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run pack
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm test
      - run: npm run test:flows
        if: runner.os != 'Linux'
      - run: xvfb-run -a npm run test:flows
        if: runner.os == 'Linux'
